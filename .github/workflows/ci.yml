name: Validate SocietyOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node --check src/server.js
        working-directory: backend
      - run: node --check src/app.js
        working-directory: backend
      - run: node --check src/routes/dashboard.js
        working-directory: backend
      - run: node --check src/routes/auth.js
        working-directory: backend
      - run: node --check src/routes/flats.js
        working-directory: backend
      - run: node --check src/routes/maintenance.js
        working-directory: backend
      - run: node --check src/routes/payments.js
        working-directory: backend
      - run: node --check src/routes/complaints.js
        working-directory: backend
      - run: node --check src/routes/visitors.js
        working-directory: backend
      - run: node --check src/utils/fields.js
        working-directory: backend
      - run: node --check ../mobile-app/api.js
        working-directory: backend
      - run: npm test
        working-directory: backend

  mobile-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npx expo export --platform web --output-dir .expo-export
