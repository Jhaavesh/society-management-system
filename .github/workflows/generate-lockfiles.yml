name: Generate SocietyOS lockfiles

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts
        working-directory: web-admin
      - run: npm install --package-lock-only --ignore-scripts
        working-directory: backend
      - run: npm install --package-lock-only --ignore-scripts
        working-directory: mobile-app
      - run: |
          mkdir -p lockfiles
          cp web-admin/package-lock.json lockfiles/web-admin.package-lock.json
          cp backend/package-lock.json lockfiles/backend.package-lock.json
          cp mobile-app/package-lock.json lockfiles/mobile-app.package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: society-os-lockfiles
          path: lockfiles
